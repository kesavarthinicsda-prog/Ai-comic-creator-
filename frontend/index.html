<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>ComicCraft</title>

<link
rel="stylesheet"
href="style.css"
>

</head>


<body>

<div class="container">

<h1>🎨 ComicCraft</h1>

<p>
AI Comic Story Creator
</p>


<div class="form-box">

<label>Story Prompt</label>

<textarea
id="story_prompt"
placeholder="Enter your story idea..."
></textarea>


<label>Character Name</label>

<input
id="character_name"
placeholder="Enter character name"
>


<label>Setting</label>

<input
id="setting"
placeholder="Example: Chennai"
>


<label>Tone</label>

<select id="tone">

<option>Adventure</option>

<option>Funny</option>

<option>Romantic</option>

<option>Fantasy</option>

<option>Horror</option>

</select>


<label>Art Style</label>

<select id="art_style">

<option>Comic Book</option>

<option>Anime</option>

<option>Manga</option>

<option>Cartoon</option>

<option>Watercolor</option>

</select>


<label>Number of Panels</label>

<input
type="number"
id="panels"
value="4"
min="1"
max="8"
>


<button onclick="generateComic()">

✨ Generate Comic

</button>

</div>


<div id="loading">

Generating your comic...

</div>


<div id="result"></div>

</div>


<script src="script.js"></script>

</body>

</html>
